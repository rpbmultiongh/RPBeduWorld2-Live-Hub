<!DOCTYPE html>
<html lang="en" data-theme="dark" style="--app-hue1:#27ae60;--app-hue2:#16a085">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnMaster X · RPBeduWorld2</title>
<meta name="description" content="Client-side LMS: courses, lessons, quizzes, gradebook, badges and analytics — no server needed.">
<link rel="icon" href="../../shared/favicon.svg">
<link rel="stylesheet" href="../../shared/rpw2.css">
<style>
  .course-card { display:flex; flex-direction:column; gap:10px; }
  .course-banner { height:74px; border-radius:11px; background:linear-gradient(120deg,var(--cb1,#27ae60),var(--cb2,#16a085)); display:flex; align-items:center; justify-content:center; font-size:34px; }
  .lesson-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:11px; border:1px solid var(--glass-brd); background:var(--input-bg); margin-bottom:9px; cursor:pointer; transition:all .15s ease; }
  .lesson-row:hover { border-color:var(--app-hue1); transform:translateX(4px); }
  .lesson-num { width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:13px; background:var(--panel); border:1px solid var(--glass-brd); }
  .lesson-num.done { background:linear-gradient(120deg,var(--app-hue1),var(--app-hue2)); color:#fff; border-color:transparent; }
  .lesson-body h4{font-size:14.5px;} .lesson-body p{font-size:12px;color:var(--txt-3);}
  .content-html { line-height:1.8; font-size:15px; max-width:780px; margin:0 auto; }
  .content-html h2,.content-html h3{margin:.8em 0 .3em;} 
  .badge-tile { text-align:center; padding:13px 8px; border-radius:12px; border:1px solid var(--glass-brd); opacity:.35; filter:grayscale(1); }
  .badge-tile.earned{opacity:1;filter:none;border-color:rgba(243,156,18,.45);background:rgba(243,156,18,.07);}

  #qzOpts{display:flex;flex-direction:column;gap:9px}
  .quiz-opt{display:flex;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:12px;
    border:1px solid var(--glass-brd);background:var(--input-bg);color:var(--txt);font-size:14.5px;line-height:1.45;
    font-family:inherit;cursor:pointer;transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}
  .quiz-opt:hover:not(:disabled){transform:translateY(-2px);border-color:#27ae60;box-shadow:0 6px 18px -8px rgba(39,174,96,.5)}
  .quiz-opt .key{flex:none;display:inline-grid;place-items:center;width:25px;height:25px;margin-right:11px;border-radius:8px;
    background:color-mix(in srgb,#27ae60 16%,transparent);font-weight:800;font-size:12px}
  .quiz-opt.right{border-color:#2ecc71;background:color-mix(in srgb,#2ecc71 15%,var(--input-bg))}
  .quiz-opt.right .key{background:#2ecc71;color:#04240f}
  .quiz-opt.wrong{border-color:#e74c3c;background:color-mix(in srgb,#e74c3c 13%,var(--input-bg))}
  .cont-strip{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;border:1px solid color-mix(in srgb,#27ae60 35%,transparent);
    background:linear-gradient(120deg,color-mix(in srgb,#27ae60 10%,transparent),transparent);margin-bottom:14px}
  @media print{
    body *{visibility:hidden!important}
    #certBox,#certBox *{visibility:visible!important}
    #certBox{position:fixed;inset:0;margin:0!important;max-width:none!important;box-shadow:none!important;border:none!important;display:grid;place-items:center;background:#fff;color:#111}
  }
</style>
</head>
<body>
<header class="rpw-topbar">
  <a class="rpw-home" href="../../index.html"><b>⬡ RPW²</b></a>
  <div class="rpw-app-title"></div>
  <div class="rpw-topbar-actions">
    <button class="rpw-btn sm" id="btnImport">Import course</button>
    <button class="rpw-btn sm primary" id="btnNewCourse">＋ Course</button>
    <button class="rpw-theme-toggle" aria-label="Toggle theme"></button>
  </div>
</header>
<main class="rpw-container">

  <!-- ============ LIBRARY ============ -->
  <section id="viewLibrary">
    <div class="row wrap spread mb-3">
      <div class="rpw-search-wrap"><span id="icoSearch"></span><input class="rpw-input" data-rpw-search id="searchC" placeholder="Search courses… ( / )"></div>
      <div class="rpw-btn-row">
        <select class="rpw-select" id="tabSelect" style="max-width:170px">
          <option value="courses">📚 Courses</option>
          <option value="grades">📊 Gradebook</option>
          <option value="badges">🏅 Badges</option>
        </select>
        <button class="rpw-btn" id="btnExportAll">Export all</button>
      </div>
    </div>
    <div id="kpis" class="rpw-kpis mb-3"></div>
    <div id="contStrip"></div>
    <div id="panelCourses">
      <div id="courseGrid" class="rpw-grid"></div>
    </div>
    <div id="panelGrades" class="hidden">
      <div class="rpw-panel"><div class="rpw-section-title">Quiz performance</div><div id="gradeTable"></div></div>
    </div>
    <div id="panelBadges" class="hidden">
      <div class="rpw-panel"><div class="rpw-section-title">Achievements</div><div id="badgeGrid" class="rpw-grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))"></div></div>
    </div>
  </section>

  <!-- ============ COURSE VIEW ============ -->
  <section id="viewCourse" class="hidden">
    <div class="row wrap spread mb-2">
      <button class="rpw-btn sm ghost" id="btnBackLib">← Library</button>
      <div class="rpw-btn-row">
        <button class="rpw-btn sm" id="btnAddLesson">＋ Lesson</button>
        <button class="rpw-btn sm" id="btnExportCourse">Export</button>
        <button class="rpw-btn sm ghost hidden" id="btnCert">🎓 Certificate</button>
        <button class="rpw-btn sm danger" id="btnDelCourse">Delete</button>
      </div>
    </div>
    <div class="rpw-hero" style="padding-top:6px">
      <h1 id="cvTitle" style="font-size:clamp(22px,4vw,34px)"></h1>
      <p id="cvMeta" class="muted small mt-1"></p>
      <div class="rpw-progress mt-2" style="max-width:420px;margin-left:auto;margin-right:auto"><div id="cvBar"></div></div>
    </div>
    <div id="lessonList" style="max-width:760px;margin:0 auto"></div>
  </section>

  <!-- ============ LESSON VIEW ============ -->
  <section id="viewLesson" class="hidden">
    <div class="row wrap mb-2"><button class="rpw-btn sm ghost" id="btnBackCourse">← Course</button>
      <span class="muted small" id="lsMeta"></span></div>
    <div class="rpw-panel rpw-rise">
      <h2 id="lsTitle" style="margin-bottom:12px"></h2>
      <div class="content-html muted" id="lsBody"></div>
      <hr class="divider">
      <div class="row spread">
        <label class="small row" style="gap:7px;cursor:pointer"><input type="checkbox" id="lsDone"> Completed</label>
        <button class="rpw-btn primary" id="btnStartQuiz">Start Quiz →</button>
        <button class="rpw-btn sm ghost no-print" id="btnGenQuiz">✨ Generate quiz</button>
      </div>
    </div>
    <!-- QUIZ -->
    <div id="quizBox" class="hidden mt-3">
      <div class="rpw-panel">
        <div class="row spread mb-2"><b>Lesson quiz</b><span class="small muted" id="qzProg"></span></div>
        <div class="rpw-progress mb-3"><div id="qzBar"></div></div>
        <h3 id="qzQ" class="mb-2" style="font-size:17px"></h3>
        <div id="qzOpts"></div>
        <div id="qzDoneWrap" class="hidden center mt-3"></div>
      </div>
    </div>
  </section>
</main>
<footer class="rpw-footer">LearnMaster X · part of <b>RPBeduWorld2</b> · a full LMS that lives in your browser</footer>
<script src="../../shared/rpw2.js"></script>
<script src="../../shared/rpw2ai.js"></script>
<script src="../../shared/rpw2support.js"></script>
<script>
(function(){
"use strict";
const toast=RPW2.toast;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const K="learnmaster.courses";
const $=s=>document.querySelector(s);
$("#icoSearch").outerHTML=RPW2.icon("search",16);
RPW2.initTopbar("LearnMaster X","book");

let courses=RPW2.store.get(K,[]);
let view="library", activeCourse=null, activeLesson=null, quiz=null;
if(!RPW2.store.get("learnmaster.seeded",false)){
  courses.push(seedCourse()); RPW2.store.set(K,courses); RPW2.store.set("learnmaster.seeded",true);
}
function save(){RPW2.store.set(K,courses);}

function seedCourse(){
  return {id:RPW2.uid(),title:"Introduction to Eukaryotic Cells",subject:"Biology",emoji:"🧫",created:new Date().toISOString(),
   lessons:[
    {id:RPW2.uid(),title:"Cell Theory & Overview",body:"<h3>Cell theory</h3><p>All living organisms are composed of <b>cells</b>, the cell is the basic unit of life, and all cells arise from pre-existing cells.</p><h3>Eukaryotes vs prokaryotes</h3><p>Eukaryotic cells contain a <b>true nucleus</b> and membrane-bound organelles. Prokaryotes (bacteria, archaea) do not.</p>",quiz:[
      {q:"Which structure defines eukaryotic cells?",options:["True nucleus","Cell wall","Flagellum","Plasmid"],answer:0},
      {q:"Which organisms are prokaryotes?",options:["Fungi","Bacteria & archaea","Plants","Animals"],answer:1}],
      done:false,scores:[]},
    {id:RPW2.uid(),title:"The Nucleus & Genetic Material",body:"<h3>The nucleus</h3><p>The nucleus stores DNA, coordinates replication and transcription. The <b>nucleolus</b> assembles ribosomal subunits.</p><h3>Chromatin</h3><p>DNA wraps around histone proteins forming chromatin, condensing into chromosomes during division.</p>",quiz:[
      {q:"Ribosomal subunits are assembled in the…",options:["Nucleolus","Golgi apparatus","Lysosome","Centrosome"],answer:0},
      {q:"DNA wraps around which proteins?",options:["Actin","Tubulin","Histones","Collagen"],answer:2}],
      done:false,scores:[]},
    {id:RPW2.uid(),title:"Endomembrane System",body:"<h3>Flow of materials</h3><p>Rough ER synthesizes proteins → Golgi modifies & sorts → vesicles deliver to membrane or become <b>lysosomes</b>.</p><h3>Smooth ER</h3><p>Lipid synthesis, calcium storage, detoxification.</p>",quiz:[
      {q:"Proteins are modified and sorted in the…",options:["Rough ER","Golgi apparatus","Smooth ER","Nucleolus"],answer:1},
      {q:"Digestive organelle of the cell",options:["Ribosome","Mitochondrion","Lysosome","Vacuole"],answer:2}],
      done:false,scores:[]},
    {id:RPW2.uid(),title:"Energy: Mitochondria & Chloroplasts",body:"<h3>Mitochondria</h3><p>Perform cellular respiration: glucose + O₂ → ATP + CO₂ + H₂O. Have their own DNA (endosymbiotic origin).</p><h3>Chloroplasts</h3><p>In plants/algae: photosynthesis converts light energy into glucose.</p>",quiz:[
      {q:"ATP is primarily produced in the…",options:["Nucleus","Mitochondrion","Lysosome","Golgi"],answer:1},
      {q:"Photosynthesis happens in…",options:["Chloroplasts","Mitochondria","Peroxisomes","Ribosomes"],answer:0}],
      done:false,scores:[]}
  ]};
}

/* ---------- views ---------- */
function show(v){
  view=v;
  $("#viewLibrary").classList.toggle("hidden",v!=="library");
  $("#viewCourse").classList.toggle("hidden",v!=="course");
  $("#viewLesson").classList.toggle("hidden",v!=="lesson");
}
function courseById(id){return courses.find(c=>c.id===id);}
function courseProgress(c){
  if(!c.lessons.length)return 0;
  const d=c.lessons.filter(l=>l.done).length+(c.lessons.some(l=>l.quiz&&l.quiz.length&&l.scores.length)?0:0);
  return Math.round(c.lessons.filter(l=>l.done).length/c.lessons.length*100);
}

/* ---------- library ---------- */
function renderLibrary(){
  const tab=$("#tabSelect").value;
  $("#panelCourses").classList.toggle("hidden",tab!=="courses");
  $("#panelGrades").classList.toggle("hidden",tab!=="grades");
  $("#panelBadges").classList.toggle("hidden",tab!=="badges");
  const total=courses.length, lessons=courses.reduce((a,c)=>a+c.lessons.length,0);
  const done=courses.reduce((a,c)=>a+c.lessons.filter(l=>l.done).length,0);
  const scores=courses.flatMap(c=>c.lessons.flatMap(l=>l.scores||[]));
  $("#kpis").innerHTML=[[total,"courses"],[lessons,"lessons"],[done,"completed"],[scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)+"%":"—","avg quiz score"]]
    .map(k=>'<div class="rpw-kpi"><div class="num">'+k[0]+'</div><div class="lbl">'+k[1]+'</div></div>').join("");
  paintContinue();
  if(tab==="courses")renderCourses();
  else if(tab==="grades")renderGrades();
  else renderBadges();
}
function renderCourses(){
  const q=($("#searchC").value||"").toLowerCase();
  const grid=$("#courseGrid");grid.innerHTML="";
  const list=courses.filter(c=>!q||(c.title+" "+c.subject).toLowerCase().includes(q));
  if(!list.length){grid.innerHTML='<div class="rpw-empty" style="grid-column:1/-1"><div class="big">🎓</div><h3>'+(q?"No matches":"No courses yet")+'</h3><p>Import a course JSON or create one from scratch.</p><button class="rpw-btn primary" onclick="document.getElementById(\'btnImport\').click()">Import course JSON</button></div>';return;}
  list.forEach((c,i)=>{
    const p=courseProgress(c), doneN=c.lessons.filter(l=>l.done).length;
    const el=document.createElement("div");
    el.className="rpw-card clickable rpw-rise"; el.style.animationDelay=(i*.05)+"s"; el.style.setProperty("--cb1","#27ae60");el.style.setProperty("--cb2","#16a085");
    el.innerHTML='<div class="course-banner">'+(c.emoji||"📘")+'</div>'+
      '<h3 class="truncate">'+esc(c.title)+'</h3><span class="tiny faint">'+esc(c.subject||"General")+' · '+c.lessons.length+' lessons</span>'+
      '<div class="rpw-progress mt-1"><div style="width:'+p+'%"></div></div>'+
      '<div class="row spread mt-1"><span class="tiny muted">'+doneN+'/'+c.lessons.length+' complete</span>'+
      '<span class="row" style="gap:5px"><button class="rpw-btn icon-only" data-x="'+c.id+'" aria-label="Delete course">'+RPW2.icon("trash",14)+'</button>'+
      '<button class="rpw-btn sm primary" data-o="'+c.id+'">Open</button></span></div>';
    el.onclick=e=>{
      const t=e.target.closest("[data-x],[data-o]");
      if(t&&t.dataset.x!==undefined&&t.dataset.x)return delCourse(t.dataset.x);
      openCourse(t?t.dataset.o:c.id);
    };
    grid.appendChild(el);
  });
}
async function delCourse(id){
  const c=courseById(id);
  if(await RPW2.confirm({title:"Delete course?",message:'"'+c.title+'" with '+c.lessons.length+' lessons will be removed.',danger:true,yesLabel:"Delete"})){
    courses=courses.filter(x=>x.id!==id);save();renderLibrary();toast("Course deleted","ok");
  }
}
function renderGrades(){
  const rows=[];
  courses.forEach(c=>c.lessons.forEach(l=>(l.scores||[]).forEach(s=>rows.push({course:c.title,lesson:l.title,score:s}))));
  $("#gradeTable").innerHTML=rows.length?'<table class="rpw-table"><thead><tr><th>Course</th><th>Lesson</th><th>Score</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td class="truncate" style="max-width:200px">'+esc(r.course)+'</td><td class="truncate" style="max-width:220px">'+esc(r.lesson)+'</td><td><span class="rpw-badge '+(r.score>=80?"ok":r.score>=50?"warn":"err")+'">'+r.score+'%</span></td></tr>').join("")+"</tbody></table>"
    :'<div class="rpw-empty"><div class="big">📊</div><p>No quiz attempts yet — take a lesson quiz!</p></div>';
}
function renderBadges(){
  const badges=[
    ["🌱","First Steps","Complete 1 lesson",()=>countDone()>=1],
    ["📖","Bookworm","Complete 5 lessons",()=>countDone()>=5],
    ["🏆","Course Conqueror","Finish an entire course",()=>courses.some(c=>c.lessons.length&&c.lessons.every(l=>l.done))],
    ["🎯","Sharpshooter","Score 100% on any quiz",()=>courses.flatMap(c=>c.lessons).flatMap(l=>l.scores||[]).some(s=>s===100)],
    ["🧠","Scholar","Average ≥80% across quizzes",()=>avg()>80],
    ["🏛️","Architect","Create your own course",()=>courses.length>1],
    ["💯","Perfectionist","Ace three quizzes with 100%",()=>courses.flatMap(c=>c.lessons).flatMap(l=>l.scores||[]).filter(x=>x===100).length>=3]
  ];
  $("#badgeGrid").innerHTML=badges.map(b=>'<div class="badge-tile'+(b[3]()?" earned":"")+'"><div style="font-size:30px">'+b[0]+'</div><b class="small">'+b[1]+'</b><p class="tiny faint">'+b[2]+'</p></div>').join("");
}
function countDone(){return courses.reduce((a,c)=>a+c.lessons.filter(l=>l.done).length,0);}
function avg(){const s=courses.flatMap(c=>c.lessons).flatMap(l=>l.scores||[]);return s.length?s.reduce((a,b)=>a+b,0)/s.length:0;}


/* ---------- continue learning strip ---------- */
function nextUp(){
 for(const c of courses){const i=c.lessons.findIndex(l=>!l.done);if(i>=0)return{c,l:c.lessons[i],i};}
 return null;
}
function paintContinue(){
 const host=$("#contStrip");if(!host)return;
 const n=nextUp();
 if(!n||view!=="library"){host.innerHTML="";return;}
 const totalDone=n.c.lessons.filter(l=>l.done).length;
 host.innerHTML='<div class="cont-strip"><div style="font-size:26px">'+(n.c.emoji||"📘")+'</div>'+
  '<div class="grow"><b class="small">Continue where you left off</b><div class="tiny muted">'+esc(n.c.title)+" → Lesson "+(n.i+1)+": "+esc(n.l.title)+" · "+totalDone+"/"+n.c.lessons.length+" done</div></div>"+
  '<button class="rpw-btn sm primary" id="btnCont">Resume →</button></div>';
 $("#btnCont").onclick=()=>openCourse(n.c.id);
}

/* ---------- course view ---------- */
function openCourse(id){
  activeCourse=courseById(id); if(!activeCourse)return;
  show("course"); paintCourse();
}
function paintCourse(){
  const c=activeCourse,p=courseProgress(c),doneN=c.lessons.filter(l=>l.done).length;
  $("#cvTitle").textContent=(c.emoji?c.emoji+" ":"")+c.title;
  $("#cvMeta").textContent=c.subject||"General"+" · "+c.lessons.length+" lessons · "+doneN+" completed";
  $("#cvBar").style.width=p+"%";
  $("#btnCert").classList.toggle("hidden",p<100);
  const box=$("#lessonList");box.innerHTML="";
  if(!c.lessons.length){box.innerHTML='<div class="rpw-empty"><div class="big">📄</div><h3>No lessons yet</h3><p>Add your first lesson to build this course.</p></div>';return;}
  c.lessons.forEach((l,i)=>{
    const el=document.createElement("div");
    el.className="lesson-row";
    el.innerHTML='<div class="lesson-num'+(l.done?" done":"")+'">'+(l.done?RPW2.icon("check",14):i+1)+'</div>'+
      '<div class="grow lesson-body"><h4>'+esc(l.title)+'</h4><p>'+(l.quiz&&l.quiz.length? l.quiz.length+" quiz questions"+(l.scores&&l.scores.length?" · best "+Math.max(...l.scores)+"%":"") : "reading")+'</p></div>'+
      RPW2.icon("chevronRight",16);
    el.onclick=()=>openLesson(i);
    box.appendChild(el);
  });
}

/* ---------- lesson view ---------- */
function openLesson(i){
  activeLesson=i;
  const l=activeCourse.lessons[i];
  show("lesson");$("#quizBox").classList.add("hidden");
  $("#lsTitle").textContent=l.title;
  $("#lsBody").innerHTML=l.body||"<p><em>(No content — add body HTML when editing)</em></p>";
  $("#lsDone").checked=!!l.done;
  $("#lsDone").onchange=()=>{
    l.done=$("#lsDone").checked;save();
    toast(l.done?"Lesson completed ✓":"Marked incomplete","ok");
    if(l.done)RPW2.confetti();
  };
}

$("#btnCert").onclick=()=>{
 const c=activeCourse;
 const scores=c.lessons.flatMap(l=>l.scores||[]);
 const avgS=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
 const m=RPW2.modal("🎓 Course certificate",
  '<div id="certBox" style="text-align:center;padding:34px 22px;border:2px solid #c9a227;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,#f1c40f 8%,var(--panel-solid)),var(--panel-solid))">'+
   '<div style="font-size:44px">🎓</div>'+
   '<h1 style="margin:6px 0;font-size:24px" class="grad-text">Certificate of Completion</h1>'+
   '<p class="tiny faint" style="letter-spacing:.18em;text-transform:uppercase">RPBeduWorld² · LearnMaster X</p>'+
   '<p class="muted mt-3">This certifies that</p><h2 id="certName" style="margin:4px 0"></h2>'+
   '<p class="muted">has successfully completed</p><h3 style="margin:4px 0">'+esc(c.title)+'</h3>'+
   '<p class="tiny muted mt-1">'+c.lessons.length+' lessons'+(avgS!=null?" · average score "+avgS+"%":"")+"</p>"+
   '<p class="tiny faint mt-3">'+new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})+"</p></div>"+
  '<div class="row spread mt-3"><input class="rpw-input grow" id="certIn" placeholder="Your name for the certificate" style="max-width:240px">'+
   '<button class="rpw-btn primary" id="certPrint">🖨️ Print / Save PDF</button></div>');
 const inp=m.el.querySelector("#certIn");
 try{inp.value=(JSON.parse(RPW2.store.get("learnmaster.profile","{}")).name)||"";}catch(e){}
 m.el.querySelector("#certPrint").onclick=()=>{
  const nm=inp.value.trim()||"A Dedicated Scholar";
  m.el.querySelector("#certName").textContent=nm;
  RPW2.store.set("learnmaster.profile",JSON.stringify({name:nm}));
  setTimeout(()=>window.print(),80);
 };
};

$("#btnBackLib").onclick=()=>{show("library");renderLibrary();};
$("#btnBackCourse").onclick=()=>show("course");

/* ---------- quiz runner ---------- */
$("#btnStartQuiz").onclick=()=>{
  const l=activeCourse.lessons[activeLesson];
  if(!l.quiz||!l.quiz.length){toast("This lesson has no quiz questions","info");return;}
  quiz={items:l.quiz,idx:0,score:0,lesson:l,misses:[]};
  $("#qzDoneWrap").classList.add("hidden");
  $("#quizBox").classList.remove("hidden");
  if($("#quizBox").scrollIntoView)$("#quizBox").scrollIntoView({behavior:"smooth"});
  paintQZ();
};
function paintQZ(){
  const it=quiz.items[quiz.idx];
  $("#qzProg").textContent=(quiz.idx+1)+" / "+quiz.items.length;
  $("#qzBar").style.width=(quiz.idx/quiz.items.length*100)+"%";
  $("#qzQ").textContent=it.q;
  $("#qzOpts").innerHTML=it.options.map((o,i)=>'<button class="quiz-opt" data-i="'+i+'"><span class="key">'+"ABCD"[i]+"</span><span>"+esc(o)+"</span></button>").join("");
  const btns=[...$("#qzOpts").children];
  if(qzKeys)document.removeEventListener("keydown",qzKeys);
  qzKeys=e=>{
   const i="abcd1234".indexOf(e.key.toLowerCase());
   if(i>=0&&i<btns.length&&!btns[0].disabled){e.preventDefault();btns[i].click();}
  };
  document.addEventListener("keydown",qzKeys);
  btns.forEach(b=>b.onclick=()=>{
    [...$("#qzOpts").children].forEach((el,i)=>{
      el.disabled=true;
      if(i===it.answer)el.classList.add("right");
      else if(el===b)el.classList.add("wrong");
    });
    if(+b.dataset.i===it.answer){quiz.score++;RPW2.sfx.ok();}else{RPW2.sfx.err();quiz.misses.push(it);}
    setTimeout(nextQZ,800);
  });
}
let qzKeys=null;
function nextQZ(){
  quiz.idx++;
  if(quiz.idx>=quiz.items.length){
    if(qzKeys){document.removeEventListener("keydown",qzKeys);qzKeys=null;}
    const pct=Math.round(quiz.score/quiz.items.length*100),n=quiz.items.length,mN=quiz.misses.length;
    quiz.lesson.scores=(quiz.lesson.scores||[]).concat([pct]);
    if(pct>=60)quiz.lesson.done=true;
    save();
    $("#qzOpts").innerHTML="";$("#qzQ").textContent="";
    const w=$("#qzDoneWrap");w.classList.remove("hidden");
    w.innerHTML='<div style="font-size:46px">'+(pct>=80?"🏆":pct>=60?"💪":"📚")+'</div><h3 class="grad-text" style="font-size:26px">'+pct+"%</h3>"+
     '<p class="muted small mt-1">'+quiz.score+" / "+n+' correct'+(pct<60?" — below the 60% pass mark. Review the material and retry!":" — saved to gradebook")+"</p>"+
     '<div class="row mt-2" style="justify-content:center;gap:9px;flex-wrap:wrap">'+
     (mN?'<button class="rpw-btn ghost" id="qzMRetry">↻ Retry '+mN+" missed</button>":"")+
     '<button class="rpw-btn primary" id="qzFinish">Finish</button></div>';
    w.querySelector("#qzFinish").onclick=()=>{ $("#quizBox").classList.add("hidden");w.classList.add("hidden");paintCourse();renderLibrary(); };
    const mr=w.querySelector("#qzMRetry");
    if(mr)mr.onclick=()=>{
      const items=(function(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;})(quiz.misses.map(x=>Object.assign({},x)));
      quiz={items,idx:0,score:0,lesson:quiz.lesson,misses:[],retrying:true};
      w.classList.add("hidden");paintQZ();
    };
    if(pct>=80)RPW2.confetti();else RPW2.sfx.level();
  } else paintQZ();
}
document.addEventListener("qz-done",()=>paintCourse());


/* ✨ generate quiz questions from this lesson's own content */
$("#btnGenQuiz").onclick=()=>{
 const l=activeCourse.lessons[activeLesson];
 const text=(l.body||"").replace(/<[^>]+>/g," ").trim();
 if(text.length<80){toast("Add lesson content first — then I can forge questions from it","info");return;}
 RPW2.AI.studio({
  title:"✨ Quiz Forge — from this lesson",
  subtitle:"Generate quiz questions strictly from this lesson material.",
  fields:[{id:"n",label:"Questions",type:"number",value:4,min:2,max:10}],
  buildPrompt:v=>`Create ${v.n} multiple-choice quiz questions strictly from this lesson content. Respond ONLY as JSON array of {"q":"...","options":["a","b","c","d"],"answer":<index>}. Distractors must be plausible.\n\nLESSON:\n${text.slice(0,3500)}`,
  offline:v=>{
   const g=RPW2.AI.gen,r=g.rng(l.title+Math.random()),n=Math.max(2,Math.min(10,+v.n||4)),out=[];
   const sents=text.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>=7&&x.length>=40&&x.length<=240);
   const kwAll=[...new Set(sents.flatMap(x=>g.kw(x)).filter(k=>k.length>4))];
   for(const sent of g.shuf(sents,r)){
    const ks=g.kw(sent).filter(k=>k.length>4&&sent.includes(k));
    if(!ks.length)continue;
    const ans=g.pick(ks,r);let q;
    try{q=sent.replace(new RegExp(ans.replace(/[.*+?^\${}()|[\]\\]/g,"\\$&"),"i"),"_____");}catch(e){continue;}
    if(q===sent)continue;
    const wrongs=g.shuf(kwAll.filter(x=>x!==ans),r).slice(0,3);
    while(wrongs.length<3){const f=["mechanism","structure","principle"][wrongs.length];if(!wrongs.includes(f))wrongs.push(f);}
    const opts=g.shuf([ans,...wrongs],r);
    out.push({q,options:opts,answer:opts.indexOf(ans)});
    if(out.length>=n)break;
   }
   return out;
  },
  preview:d=>d.map(q=>`<div class="ai-item"><b>${RPW2.escapeHtml(String(q.q).slice(0,120))}</b><br><span class="small" style="color:#2ecc71">✔ ${RPW2.escapeHtml(String((q.options&&q.options[q.answer]!=null)?q.options[q.answer]:q.answer).slice(0,90))}</span></div>`).join(""),
  validate:d=>{
   const arr=(Array.isArray(d)?d:d.questions||[]).map(q=>{
     if(Array.isArray(q))return {q:String(q[0]||""),options:[String(q[1])].concat((q[2]||[]).map(String)),answer:0};
     const opts=(q.options||[]).map(String);
     return {q:String(q.q||""),options:opts,answer:Math.max(0,Math.min(opts.length-1,+q.answer||0))};
   }).filter(x=>x.q&&x.options.length>=2);
   if(!arr.length)throw new Error("No usable questions found");
   return arr;
  },
  onData:(d,src,close)=>{
   l.quiz=(l.quiz||[]).concat(d);
   save();close();
   toast(d.length+" questions added to \""+l.title+"\" ("+(src==="gemini"?"Gemini":"smart generator")+")","ok");
   openLesson(activeLesson);
   RPW2.confetti&&RPW2.confetti();
  }
 });
};

/* ---------- create/import/export ---------- */
$("#btnNewCourse").onclick=()=>{
  const m=RPW2.modal("Create course",
   '<div class="rpw-field"><label class="rpw-label">Title</label><input class="rpw-input" id="ct" placeholder="e.g. Organic Chemistry I"></div>'+
   '<div class="row" style="gap:10px"><div class="rpw-field grow"><label class="rpw-label">Subject</label><input class="rpw-input" id="cs" placeholder="Chemistry"></div>'+
   '<div class="rpw-field" style="width:90px"><label class="rpw-label">Emoji</label><input class="rpw-input" id="ce" value="📘" maxlength="4"></div></div>'+
   '<div class="row spread"><button class="rpw-btn ghost" data-x>Cancel</button><button class="rpw-btn primary" id="cgo">Create</button></div>');
  m.el.querySelector("#cgo").onclick=()=>{
    const t=m.el.querySelector("#ct").value.trim();if(!t){toast("Title required","err");return;}
    const c={id:RPW2.uid(),title:t,subject:m.el.querySelector("#cs").value.trim()||"General",emoji:m.el.querySelector("#ce").value.trim()||"📘",created:new Date().toISOString(),lessons:[]};
    courses.unshift(c);save();m.close();openCourse(c.id);toast("Course created — now add lessons","ok");
  };
};
$("#btnAddLesson").onclick=()=>{
  const m=RPW2.modal("Add lesson to "+esc(activeCourse.title),
   '<div class="rpw-field"><label class="rpw-label">Lesson title</label><input class="rpw-input" id="lt"></div>'+
   '<div class="rpw-field"><label class="rpw-label">Content (HTML allowed)</label><textarea class="rpw-textarea" id="lb" style="min-height:150px;font-family:var(--rpw-mono);font-size:12.5px" placeholder="<h3>Heading</h3><p>Paragraph…</p>"></textarea></div>'+
   '<div class="rpw-field"><label class="rpw-label">Quiz questions — JSON array [{q, options:[...], answer:index}] (optional)</label><textarea class="rpw-textarea" id="lq" style="min-height:90px;font-family:var(--rpw-mono);font-size:12.5px" placeholder=\'[{"q":"What is ATP?","options":["Energy currency","A lipid"],"answer":0}]\'></textarea></div>'+
   '<div class="row spread"><button class="rpw-btn ghost" data-x>Cancel</button><button class="rpw-btn primary" id="lgo">Add lesson</button></div>');
  m.el.querySelector("#lgo").onclick=()=>{
    const t=m.el.querySelector("#lt").value.trim();if(!t){toast("Title required","err");return;}
    let q=[];const raw=m.el.querySelector("#lq").value.trim();
    if(raw){try{q=JSON.parse(raw);if(!Array.isArray(q))throw new Error("must be array");}catch(e){toast("Quiz JSON invalid: "+e.message,"err");return;}}
    activeCourse.lessons.push({id:RPW2.uid(),title:t,body:m.el.querySelector("#lb").value,quiz:q,done:false,scores:[]});
    save();m.close();paintCourse();toast("Lesson added","ok");
  };
};
$("#btnExportCourse").onclick=()=>{
  const c=activeCourse;
  RPW2.download(slugify(c.title)+".course.json",JSON.stringify({schema:"rpw2.course.v1",title:c.title,subject:c.subject,author:"",created:c.created,
    modules:[{id:"m1",title:c.title,lessons:c.lessons.map(l=>({id:l.id,title:l.title,content:(l.body||"").replace(/<[^>]+>/g," "),quiz:(l.quiz||[]).map(q=>({q:q.q,options:q.options,answerIndex:q.answer}))}))}]},null,2),"application/json");
  toast("Course exported (universal schema)","ok");
};
$("#btnExportAll").onclick=()=>{
  RPW2.download("learnmaster-all-courses.json",JSON.stringify({exported:new Date().toISOString(),courses},null,2),"application/json");
  toast("All courses exported","ok");
};
$("#btnImport").onclick=async()=>{
  const f=await RPW2.pickFile(".json,application/json");if(!f)return;
  try{
    const readText=(fl)=>new Promise((res,rej)=>{if(typeof fl.text==="function")return fl.text().then(res,rej);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("read error"));r.readAsText(fl);});
    const j=JSON.parse(await readText(f));
    // accept: internal export {courses:[...]}, universal rpw2.course.v1, legacy LGAI/LMP shapes
    if(j.courses){ j.courses.forEach(c=>{c.id=RPW2.uid();courses.unshift(c);}); save();renderLibrary();toast(j.courses.length+" course(s) imported","ok");return; }
    let title=j.title||"Imported course", subject=j.subject||"", lessons=[];
    const mods=j.modules||[];
    mods.forEach(mod=>{
      (mod.lessons||mod.units||[]).forEach(ls=>{
        let body="",quizArr=[];
        if(ls.units){ // LMP style
          ls.units.forEach(u=>{
            if(u.type==="TEXT")body+="<p>"+esc(u.text||u.content||"")+"</p>";
            else if(u.type==="IMAGE")body+='<img src="'+esc(u.url||u.src||"")+'" alt="" style="max-width:100%;border-radius:10px">';
            else if(u.type==="QUIZ"&&u.question)quizArr.push({q:u.question,options:(u.options||[]).map(o=>o.text!=null?o.text:o),answer:u.correctOptionIndex!=null?u.correctOptionIndex:(u.correctIndex||0)});
          });
        } else {
          body="<p>"+esc(typeof ls.content==="string"?ls.content:(ls.content&&ls.content.text)||"")+"</p>";
          quizArr=(ls.quiz||[]).map(q=>({q:q.q||q.question,options:q.options,answer:q.answerIndex!=null?q.answerIndex:(q.answer||0)}));
        }
        lessons.push({id:RPW2.uid(),title:ls.title||"Lesson",body,quiz:quizArr,done:false,scores:[]});
      });
    });
    if(!lessons.length)throw new Error("no lessons found");
    courses.unshift({id:RPW2.uid(),title,subject,emoji:"📥",created:new Date().toISOString(),lessons});
    save();renderLibrary();toast('Imported "'+title+'" ('+lessons.length+" lessons)","ok");
  }catch(e){toast("Import failed: "+e.message,"err");}
};
$("#tabSelect").onchange=renderLibrary;
$("#searchC").oninput=renderLibrary;
function slugify(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"course";}
show("library");renderLibrary();

/* ================= AI STUDIO — course builder ================= */
RPW2.AI.attachFab(()=>RPW2.AI.studio({
 title:"✨ AI Course Builder",
 subtitle:"Describe a topic — get a complete course with lessons and quizzes in one shot.",
 fields:[
  {id:"topic",label:"Course topic",placeholder:"e.g. Intro to Astronomy, Spanish tenses, Web security"},
  {id:"lessons",label:"Lessons",type:"number",value:4,min:2,max:6},
  {id:"level",label:"Level",type:"select",options:[{v:"beginner",t:"Beginner"},{v:"intermediate",t:"Intermediate"},{v:"advanced",t:"Advanced"}]},
  {id:"notes",label:"Source material (optional — lessons will draw from this)",type:"textarea",placeholder:"Paste lecture notes, a syllabus or reference text…"}
 ],
 buildPrompt:v=>`Design a complete ${v.level} mini-course about "${v.topic}" with exactly ${v.lessons} lessons.${(v.notes||"").trim()?" Base all lesson content strictly on this source material:\n\n"+v.notes.trim().slice(0,3000):""} Respond ONLY as JSON {"title":"...","subject":"...","emoji":"...","lessons":[{"title":"...","html":"<h3>...</h3><p>...</p> (150-250 words)","quiz":[{"q":"...","options":["a","b","c","d"],"answer":0}]}]}.`,
 offline:v=>{
  const g=RPW2.AI.gen,r=g.rng(v.topic+Math.random()),n=Math.min(6,Math.max(2,+v.lessons||4));
  const secs=g.outline(v.topic,n+1,r),t=g.T(v.topic);
  const lessons=secs.slice(1,n+1).map((s,i)=>{
   const m=g.mcq(v.topic+" "+s,r),m2=g.mcq(v.topic+" advanced aspects "+s,r);
   const pair=g.shortQA(v.topic+" "+s,r).pairs[0];
   const html=`<h3>${esc(s)}</h3><p>${g.gloss(v.topic)?g.gloss(v.topic):("This section builds your command of <b>"+esc(s.toLowerCase())+"</b> within "+esc(t)+". Read actively: pause after each paragraph and restate the idea.")}</p><h3>Key ideas</h3><ul><li>${esc(g.objectives(v.topic,3,r)[0])}</li><li>${esc(g.objectives(v.topic,3,r)[1])}</li></ul><h3>Check yourself</h3><p><i>${esc(pair[0])}</i><br>Think it through, then reveal: ${esc(pair[1].slice(0,140))}…</p>`;
   const mk=(mm)=>({q:mm.q,options:mm.options,answer:mm.answer});
   return {title:s,html,quiz:[mk(m),mk(m2),{q:pair[0],options:[pair[1],"A vague claim unrelated to the lesson","An unrelated historical date","None of these"],answer:0}]};
  });
  return {title:t,subject:v.topic.split(" ").slice(-1)[0]||"General",emoji:"✨",lessons};
 },
 preview:d=>`<b>${d.emoji||"📘"} ${RPW2.escapeHtml(d.title)}</b> <span class="tiny muted">${RPW2.escapeHtml(d.subject||"")}</span>`+
  (d.lessons||[]).map((l,i)=>`<div class="ai-item"><b>${i+1}. ${RPW2.escapeHtml(l.title)}</b> · ${(l.quiz||[]).length} quiz Qs<br><span class="muted tiny">${RPW2.escapeHtml(String(l.html||l.body||"").replace(/<[^>]+>/g," ").slice(0,130))}…</span></div>`).join(""),
 validate:d=>{
  d=d.course||d;
  if(!Array.isArray(d.lessons)||!d.lessons.length)throw new Error("No lessons generated");
  return {title:d.title||"AI course",subject:d.subject||"General",emoji:(d.emoji||"✨").slice(0,4),
   lessons:d.lessons.map(l=>({title:l.title||"Lesson",
     body:l.html||l.body||"<p>"+String(l.content||l.text||"").slice(0,2000)+"</p>",
     quiz:(l.quiz||[]).map(q=>({q:String(q.q),options:(q.options||[]).map(String),answer:+q.answer||0}))}))};
 },
 onData:(d,src,close)=>{
  const c={id:RPW2.uid(),title:d.title,subject:d.subject,emoji:d.emoji,created:new Date().toISOString(),
   lessons:d.lessons.map(l=>Object.assign(l,{id:RPW2.uid(),done:false,scores:[]}))};
  courses.unshift(c);save();openCourse(c.id);close();
  toast(`Course built: ${d.lessons.length} lessons (${src==="gemini"?"Gemini":"smart generator"})`,"ok");
  RPW2.confetti&&RPW2.confetti();
 }
}));

})();
